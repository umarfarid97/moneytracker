name: Cloud server

on:
  push:
    branches: [main]
    paths: ['cloud-worker/**']
  pull_request:
    paths: ['cloud-worker/**']

permissions:
  contents: read

defaults:
  run:
    working-directory: cloud-worker

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud-worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
