name: Android APK

# Builds an installable APK (arm64, signed with the debug key) and attaches it to the
# "apk-latest" GitHub release. Run it from the Actions tab: "Android APK" > "Run workflow".
on:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: malaysia-finance-app

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: malaysia-finance-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm test -- --ci
      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'
      - name: Build release APK
        working-directory: malaysia-finance-app/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Duit.apk
          gh release delete apk-latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create apk-latest Duit.apk --repo "$GITHUB_REPOSITORY" \
            --title "Duit APK (latest)" --target "$GITHUB_SHA" \
            --notes "Android build of commit $GITHUB_SHA. Debug-signed: for personal testing only."
