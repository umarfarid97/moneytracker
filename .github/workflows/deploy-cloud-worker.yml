name: Deploy cloud server

# Optional: deploys cloud-worker/ to Cloudflare. Needs the repository secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see docs/cloud-sync-setup.md).
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: cloud-worker

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud-worker/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx wrangler d1 migrations apply duit-cloud --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
