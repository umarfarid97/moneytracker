name: Web preview

# Publishes the browser build of the app to GitHub Pages so it can be opened on a phone.
# Needs Settings > Pages > Source = "GitHub Actions" (the workflow tries to enable it).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: malaysia-finance-app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: malaysia-finance-app/package-lock.json
      - run: npm ci
      - run: npm test -- --ci
      - name: Export web build
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
          CI: '1'
        run: |
          npx expo export --platform web
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: malaysia-finance-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
