<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="theme-color" content="#090b0a" />
    <title>Duit</title>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        margin: 0;
        background: #090b0a;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Shown from the first byte until the app has drawn something (removed by src/webCompat.ts). */
      #duit-loading {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #090b0a;
        color: #fff;
        font: 600 44px/1 -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif;
        letter-spacing: -0.5px;
      }
      #duit-loading i {
        display: block;
        width: 28px;
        height: 28px;
        margin-top: 28px;
        border: 3px solid rgba(255, 255, 255, 0.35);
        border-top-color: #fff;
        border-radius: 50%;
        animation: duit-spin 0.8s linear infinite;
      }
      @keyframes duit-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <div id="duit-loading">Duit<i></i></div>
    <div id="root"></div>
  </body>
</html>
