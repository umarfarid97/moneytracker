name: Deploy cloud server

# Deploys cloud-worker/ to Cloudflare from the Actions tab (Run workflow). No terminal needed.
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN  Cloudflare > My Profile > API Tokens > "Edit Cloudflare Workers" template, plus the permission Account > Workers R2 Storage > Edit (receipts live in R2)
#   CLOUDFLARE_ACCOUNT_ID shown on the right of the Cloudflare dashboard home
#   RESEND_API_KEY        the Resend API key (re_...)
# The PEPPER secret is generated once on the first run and kept on Cloudflare. See docs/cloud-sync-setup.md.
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: cloud-worker

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud-worker/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Create the receipts bucket if missing
        run: npx wrangler r2 bucket info duit-receipts >/dev/null 2>&1 || npx wrangler r2 bucket create duit-receipts
      - run: npx wrangler d1 migrations apply duit-cloud --remote
      - name: Deploy
        run: npx wrangler deploy 2>&1 | tee deploy.log
      - name: Set secrets
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          echo "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
          # PEPPER is made once; changing it later would make every account look new.
          if ! npx wrangler secret list | grep -q '"PEPPER"'; then
            openssl rand -hex 32 | npx wrangler secret put PEPPER
          fi
      - name: Check the server answers
        run: |
          URL=$(grep -o 'https://[^ ]*workers.dev' deploy.log | head -1)
          echo "Server address: $URL"
          echo "Server address: $URL" >> "$GITHUB_STEP_SUMMARY"
          for i in 1 2 3 4 5; do
            curl -fsS "$URL/" && break
            sleep 5
          done
